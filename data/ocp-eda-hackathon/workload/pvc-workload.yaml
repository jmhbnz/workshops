---
apiVersion: v1
kind: Namespace
metadata:
  name: production

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acme-db-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-database
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-database
  template:
    metadata:
      labels:
        app: acme-database
    spec:
      containers:
        - name: database
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c", "while true; do sleep 30; done"]
          volumeMounts:
            - name: data-volume
              mountPath: /var/lib/data
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: acme-db-pvc
