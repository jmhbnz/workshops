---
apiVersion: v1
kind: Namespace
metadata:
  name: core-banking-prod
  labels:
    security-tier: critical
    fsi-compliance: pci-dss

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swift-payment-gateway
  namespace: core-banking-prod
  labels:
    app: swift-payment-gateway
    tier: payment-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swift-payment-gateway
  template:
    metadata:
      labels:
        app: swift-payment-gateway
        tier: payment-core
    spec:
      containers:
        - name: gateway-service
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              cat << 'EOF'
              {"timestamp":"2026-09-15T09:14:58.102Z","level":"INFO","thread":"main","logger":"c.a.f.s.SwiftGatewayApplication","message":"Starting SwiftGatewayApplication v3.1.0 on swift-payment-gateway-7f89d4b5b-x92kl with PID 1"}
