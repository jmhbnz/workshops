              {"timestamp":"2026-09-15T09:15:02.105Z","level":"DEBUG","thread":"vault-auth-1","logger":"c.a.f.s.client.VaultClient","message":"POST /v1/auth/kubernetes/login HTTP/1.1 - Status: 403 Forbidden"}
              {"timestamp":"2026-09-15T09:15:04.110Z","level":"ERROR","thread":"main","logger":"com.zaxxer.hikari.HikariDataSource","message":"HikariPool-1 - Exception during pool initialization."}
              com.zaxxer.hikari.pool.HikariPool$PoolInitializationException: Failed to initialize pool: Dynamic DB credentials not supplied by SecretProvider.
                  at com.zaxxer.hikari.util.PropertyElf.setTargetFromProperties(PropertyElf.java:57)
