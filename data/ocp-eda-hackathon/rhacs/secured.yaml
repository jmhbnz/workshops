---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acs-cluster-registration
  namespace: stackrox

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acs-cluster-registration
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acs-cluster-registration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acs-cluster-registration
subjects:
  - kind: ServiceAccount
    name: acs-cluster-registration
    namespace: stackrox

---
apiVersion: batch/v1
kind: Job
metadata:
  name: acs-cluster-registration
  namespace: stackrox
spec:
  template:
    spec:
      containers:
        - name: acs-cluster-registration
          image: quay.io/alopezme/rhacs-roxctl-oc:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              CENTRAL_ADDRESS="${ROX_CENTRAL_ADDRESS:-https://central.stackrox.svc:443}"
              ADMIN_PASSWORD="${ACS_ADMIN_PASSWORD}"
              CRS_NAME="${ACS_CRS_NAME:-local-cluster}"

              if oc get secret cluster-registration-secret -n stackrox &>/dev/null; then
                echo "Cluster Registration Secret already exists. Skipping."
                exit 0
              fi

              echo -n "[1/3] Waiting for ACS Central to be ready..."
              until [[ $(curl -s -k -o /dev/null -w "%{http_code}" "$CENTRAL_ADDRESS") -eq 200 ]]; do
                echo -n "." && sleep 5
              done
              echo -e " [ONLINE]"
              echo ""

              echo "[2/3] Generating a Cluster Registration Secret (CRS) named '$CRS_NAME'..."
              roxctl --insecure-skip-tls-verify \
                -e "$CENTRAL_ADDRESS" -p "$ADMIN_PASSWORD" \
                central crs generate "$CRS_NAME" \
                --output /tmp/cluster-registration-secret.yaml
              echo ""

              echo "[3/3] Applying the CRS to the local cluster..."
              oc apply -f /tmp/cluster-registration-secret.yaml -n stackrox
          env:
            - name: ACS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-htpasswd
                  key: password
            - name: ROX_CENTRAL_ADDRESS
              value: "https://central.stackrox.svc:443"
            - name: ACS_CRS_NAME
              value: "local-cluster"
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      serviceAccountName: acs-cluster-registration
      terminationGracePeriodSeconds: 30

---
kind: SecuredCluster
apiVersion: platform.stackrox.io/v1alpha1
metadata:
  name: local
  namespace: stackrox
spec:
  centralEndpoint: https://central.stackrox.svc:443
  clusterName: local
  monitoring:
    openshift:
      enabled: true
  auditLogs:
    collection: Auto
  admissionControl:
    enforcement: Enabled
    bypass: BreakGlassAnnotation
    replicas: 1
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
    scannerComponent: AutoSense
  perNode:
    collector:
      collection: CORE_BPF
      imageFlavor: Regular
    taintToleration: TolerateTaints
