---
- name: Listen for application crash alerts
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Match pod crashloop alert
      condition: event.payload.alerts[0].labels.alertname == "KubePodCrashLooping"
      action:
        run_job_template:
          name: acme-ai-crash-analyzer
          organization: Default
          post_events: true
